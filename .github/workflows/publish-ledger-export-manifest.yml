name: Publish Ledger Export Manifest

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ledger_exports/executive_rhetoric_ledger/**"
      - "scripts/build_ledger_export_manifest.py"
      - ".github/workflows/publish-ledger-export-manifest.yml"

permissions:
  contents: write

concurrency:
  group: administrations-ledger-export-manifest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize exports and build manifest
        run: python scripts/build_ledger_export_manifest.py
      - name: Validate manifest identity and authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("exports/executive-rhetoric-ledger/manifest.json").read_text())
          assert manifest["producer_repository"] == "StegVerse-Labs/Administrations"
          assert manifest["authority"]["may_promote"] is False
          assert manifest["authority"]["requires_ledger_review"] is True
          for record in manifest["records"]:
              assert len(record["sha256"]) == 64
              assert record["path"].startswith("exports/executive-rhetoric-ledger/")
          PY
      - name: Commit normalized exports and manifest
        run: |
          git config user.name "stegverse-administrations-export-bot"
          git config user.email "stegverse-administrations-export-bot@users.noreply.github.com"
          git add exports/executive-rhetoric-ledger
          if git diff --cached --quiet; then
            echo "No export changes."
            exit 0
          fi
          git commit -m "chore: publish governed Executive Rhetoric Ledger exports"
          git push
